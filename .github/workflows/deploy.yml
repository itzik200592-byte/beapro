name: Deploy beapro.co.il

# This repository holds no game code. It builds the game's own public main branch
# (github.com/beapromanager/beapromanager.github.io) and serves it at beapro.co.il,
# next to the original address, which is not touched. Run it by hand after a release
# (gh workflow run deploy.yml -R itzik200592-byte/beapro) or wait for the hourly one.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: beapromanager/beapromanager.github.io
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
